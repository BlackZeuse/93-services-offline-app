name: Build 93 Services - Compatibility APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and verify compatibility APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Verify debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK" | head -30
          python3 - <<'PY'
          import zipfile
          apk="app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert "AndroidManifest.xml" in names
              assert "resources.arsc" in names
          print("APK archive integrity: OK")
          PY

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 93-Services-A13-Compatibility.apk

      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: 93-services-a13-compatibility-apk
          path: 93-Services-A13-Compatibility.apk
          if-no-files-found: error
          retention-days: 90
