name: Build 93 Services APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build installable 93 Services APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Create CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore 93_services_ci.keystore \
            -storepass ci-build-password \
            -alias 93servicesrelease \
            -keypass ci-build-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=93 Services, OU=TECHART, O=93 Services, L=Thohoyandou, ST=Limpopo, C=ZA"
          cat > keystore.properties <<'EOF'
          storeFile=../93_services_ci.keystore
          storePassword=ci-build-password
          keyAlias=93servicesrelease
          keyPassword=ci-build-password
          EOF

      - name: Build signed release APK
        run: gradle clean assembleRelease --stacktrace

      - name: Verify APK package and signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "APK size:"
          ls -lh "$APK"
          echo "APK package information:"
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK" | head -20
          echo "APK signature:"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"

      - name: Rename APK for download
        run: cp app/build/outputs/apk/release/app-release.apk 93-Services-Installable.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: 93-services-installable-apk
          path: 93-Services-Installable.apk
          if-no-files-found: error
