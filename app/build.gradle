plugins { id 'com.android.application' }

android {
    namespace 'co.za.techart.ninetythree'
    compileSdk 36

    defaultConfig {
        applicationId 'co.za.techart.ninetythree'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
